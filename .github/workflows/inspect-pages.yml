# Workflow to inspect and enable GitHub Pages
name: Inspect Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Get Pages site
        run: |
          echo "=== GET ==="
          curl -sS -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages || true
          echo ""
          echo "=== Try legacy enable ==="
          curl -sS -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"build_type":"legacy","source":{"branch":"master","path":"/"}}' || true
